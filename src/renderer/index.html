<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LyriX</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: media:; media-src 'self' media:"
    />
  </head>
  <body>
    <header class="toolbar">
      <button id="open-folder" type="button">Open Folder</button>
      <button id="rescan" class="secondary" type="button" disabled>Rescan</button>
      <span id="status" class="status" role="status">No folder selected</span>
      <span id="scan-progress" class="scan-progress" role="status" hidden></span>

      <div class="view-bar">
        <div id="view-switcher" class="segmented" role="group" aria-label="Library view">
          <button type="button" data-view="albums" aria-pressed="true">Albums</button>
          <button type="button" data-view="artists" aria-pressed="false">Artists</button>
          <button type="button" data-view="tracks" aria-pressed="false">Tracks</button>
          <button type="button" data-view="favorites" aria-pressed="false">Favorites</button>
          <button type="button" data-view="recent" aria-pressed="false">Recent</button>
        </div>
        <select id="sort-select" aria-label="Sort by"></select>
        <input
          id="search"
          type="search"
          placeholder="Search"
          aria-label="Search library"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          id="shortcuts-help"
          class="secondary shortcuts-help"
          type="button"
          aria-label="Keyboard shortcuts"
          aria-keyshortcuts="?"
          title="Keyboard shortcuts (?)"
        >
          ?
        </button>
      </div>
    </header>

    <main class="content">
      <section id="grid-view" class="view grid-view">
        <div id="album-grid" class="album-grid"></div>
        <p id="empty-state" class="empty-state">Open a folder to list its .flac files.</p>
      </section>

      <section id="artists-view" class="view" hidden>
        <ul id="artist-list" class="artist-list"></ul>
        <p id="artists-empty" class="empty-state" hidden></p>
      </section>

      <section id="tracks-view" class="view tracks-view" hidden>
        <div id="track-scroll" class="track-scroll"></div>
        <p id="tracks-empty" class="empty-state" hidden></p>
      </section>

      <section id="favorites-view" class="view favorites-view" hidden>
        <header class="favorites-header">
          <div class="favorites-heading">
            <h1 class="favorites-title">Favorites</h1>
            <p id="favorites-status" class="favorites-status"></p>
          </div>
          <div class="favorites-actions">
            <button id="favorites-why" class="favorites-why" type="button" hidden>Why?</button>
            <button
              id="favorites-play"
              class="action-primary"
              type="button"
              aria-label="Play favorites"
            >
              Play
            </button>
            <button
              id="favorites-shuffle"
              type="button"
              aria-label="Shuffle favorites"
              title="Shuffle favorites"
            >
              Shuffle
            </button>
          </div>
        </header>
        <div id="favorites-scroll" class="track-scroll"></div>
        <p id="favorites-empty" class="empty-state" hidden>
          No favorites yet. Press the heart on any track.
        </p>
        <section id="favorites-missing" class="favorites-missing" hidden>
          <button
            id="favorites-missing-toggle"
            class="favorites-missing-toggle"
            type="button"
            aria-expanded="false"
          ></button>
          <div id="favorites-missing-body" class="favorites-missing-body" hidden>
            <ul id="favorites-missing-list" class="favorites-missing-list"></ul>
            <button id="favorites-remove-missing" class="favorites-remove-missing" type="button">
              Remove missing
            </button>
          </div>
        </section>
      </section>

      <section id="recent-view" class="view recent-view" hidden>
        <header class="recent-header">
          <div class="recent-heading">
            <h1 class="recent-title">Recently played</h1>
            <p id="recent-status" class="recent-status"></p>
          </div>
          <div class="recent-actions">
            <button id="recent-why" class="recent-why" type="button" hidden>Why?</button>
            <button id="recent-record" class="recent-record" type="button" aria-pressed="false">
              Record history
            </button>
            <button id="recent-clear" class="recent-clear" type="button" disabled>
              Clear history
            </button>
            <button
              id="recent-play"
              class="action-primary"
              type="button"
              aria-label="Play recently played"
            >
              Play
            </button>
            <button
              id="recent-shuffle"
              type="button"
              aria-label="Shuffle recently played"
              title="Shuffle recently played"
            >
              Shuffle
            </button>
          </div>
        </header>
        <div id="recent-scroll" class="track-scroll"></div>
        <p id="recent-empty" class="empty-state" hidden></p>
        <button id="recent-start" class="recent-start" type="button" hidden>Start recording</button>
      </section>

      <section id="detail-view" class="view detail-view" hidden>
        <button id="back" class="back" type="button">← Albums</button>

        <div class="detail-header">
          <div class="detail-cover cover">
            <img id="detail-cover" alt="" />
            <span class="cover-fallback" aria-hidden="true">♪</span>
          </div>
          <div class="detail-meta">
            <h1 id="detail-title"></h1>
            <p id="detail-artist" class="muted"></p>
            <p id="detail-year" class="muted"></p>
            <div class="detail-actions">
              <button id="album-play" class="action-primary" type="button" aria-label="Play album">
                Play
              </button>
              <button id="album-shuffle" type="button" aria-label="Shuffle album">Shuffle</button>
            </div>
          </div>
        </div>

        <ol id="track-list" class="track-list"></ol>
      </section>

      <section id="artist-detail-view" class="view detail-view" hidden>
        <button id="artist-back" class="back" type="button">← Artists</button>

        <div class="artist-header">
          <h1 id="artist-name"></h1>
          <p id="artist-meta" class="muted"></p>
          <div class="artist-actions">
            <button id="artist-play" class="action-primary" type="button" aria-label="Play artist">
              Play
            </button>
            <button id="artist-shuffle" type="button" aria-label="Shuffle artist">Shuffle</button>
          </div>
        </div>

        <div id="artist-album-grid" class="album-grid artist-album-grid"></div>
      </section>

      <section id="now-playing-view" class="view now-playing-view" hidden>
        <div class="now-playing-header">
          <button id="now-playing-close" class="back" type="button">← Close</button>
          <span id="favorite-now-playing-host" class="favorite-now-playing-host"></span>
        </div>

        <div class="now-playing-body">
          <div class="now-playing-info">
            <div class="now-playing-cover cover">
              <img id="now-playing-cover" alt="" />
              <span class="cover-fallback" aria-hidden="true">♪</span>
            </div>
            <div class="now-playing-meta">
              <h1 id="now-playing-title"></h1>
              <p id="now-playing-artist" class="muted"></p>
              <p id="now-playing-album" class="muted"></p>
            </div>
          </div>

          <div class="now-playing-lyrics">
            <div class="now-playing-lyrics-header">
              <div id="translation-toggle" class="translation-toggle-host"></div>
              <div id="lyric-source-menu" class="lyric-source-menu"></div>
            </div>
            <p id="lyrics-status" class="lyrics-status" hidden></p>
            <div id="lyric-scroll" class="lyric-scroll" hidden>
              <div id="lyric-lines" class="lyric-lines"></div>
            </div>
          </div>
        </div>
      </section>

      <aside id="queue-panel" class="queue-panel" aria-label="Play queue" hidden>
        <header class="queue-panel-header">
          <div class="queue-panel-heading">
            <h2 id="queue-context" class="queue-panel-title">Queue</h2>
            <p id="queue-summary" class="queue-panel-summary"></p>
          </div>
          <div class="queue-panel-actions">
            <button id="queue-clear" class="queue-panel-clear" type="button">Clear</button>
            <button
              id="queue-close"
              class="queue-panel-close"
              type="button"
              aria-label="Close queue"
              title="Close queue"
            >
              ×
            </button>
          </div>
        </header>
        <div id="queue-scroll" class="queue-panel-scroll"></div>
      </aside>
    </main>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <footer class="player">
      <div
        id="now-playing"
        class="now-playing"
        role="button"
        tabindex="0"
        aria-label="Open Now Playing"
      >
        <div class="now-cover cover">
          <img id="now-cover" alt="" loading="lazy" decoding="async" />
          <span class="cover-fallback" aria-hidden="true">♪</span>
        </div>
        <div class="now-meta">
          <span id="now-title" class="now-title">Nothing playing</span>
          <span id="now-artist" class="now-artist"></span>
        </div>
      </div>
      <span id="favorite-current-host" class="favorite-current-host"></span>

      <div class="controls">
        <button
          id="shuffle"
          class="control-button"
          type="button"
          aria-pressed="false"
          aria-label="Shuffle: off"
          title="Shuffle: off"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"
            />
          </svg>
        </button>
        <button
          id="previous"
          class="control-button"
          type="button"
          disabled
          aria-label="Previous track"
          title="Previous track"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
          </svg>
        </button>
        <button
          id="play-pause"
          class="control-button control-button--primary play-pause"
          type="button"
          disabled
          aria-label="Play"
          title="Play"
        >
          <svg class="icon icon-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg class="icon icon-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        </button>
        <button
          id="next"
          class="control-button"
          type="button"
          disabled
          aria-label="Next track"
          title="Next track"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
          </svg>
        </button>
        <button
          id="repeat"
          class="control-button repeat-button"
          type="button"
          data-repeat="off"
          aria-pressed="false"
          aria-label="Repeat: off"
          title="Repeat: off"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
          </svg>
          <span class="repeat-one-badge" aria-hidden="true">1</span>
        </button>
        <button
          id="queue-toggle"
          class="control-button"
          type="button"
          aria-pressed="false"
          aria-expanded="false"
          aria-label="Queue"
          aria-keyshortcuts="Q"
          title="Queue (Q)"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h10v2H4v-2z" />
          </svg>
        </button>
        <span id="current-time" class="time">0:00</span>
        <input
          id="seek"
          class="seek"
          type="range"
          min="0"
          max="0"
          step="0.1"
          value="0"
          disabled
          aria-label="Seek"
        />
        <span id="duration" class="time">0:00</span>
        <input
          id="volume"
          class="volume"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
          aria-label="Volume"
        />
      </div>
    </footer>

    <audio id="audio" preload="metadata" hidden></audio>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
